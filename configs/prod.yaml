# PROD mode: Binance mainnet for CEX, mainnet RPC for DEX.
# dry_run=true is the safety default — flip to false only when you've reviewed
# unwind paths, balances and circuit-breaker tuning.
mode: prod
dry_run: true

cex:
  exchange: binance
  api_key:  "${BINANCE_API_KEY}"
  secret:   "${BINANCE_SECRET}"
  testnet:  false

wallet:
  private_key: "${PRIVATE_KEY}"

chains:
  - chain_id: 1
    rpc_url: "${MAINNET_RPC_URL}"
    ws_url:  "${WS_RPC_URL}"

# Mainnet Uniswap V2 pools — pool_address is required for PricingEngine.load_pools().
# Day-1 trade_size keeps total trade value under max_trade_usd=$5.
pairs:
  - pair: ETH/USDT
    chain_id: 1
    pool_address: "0x0d4a11d5EEaaC28EC3F61d100daF4d40471f1852"
    trade_size: "0.002"

fees:
  cex_taker_bps: "10"
  cex_maker_bps: "2"
  dex_swap_bps:  "30"
  gas_cost_usd_default: "5.0"

signal:
  min_spread_bps:    "65"
  min_profit_usd:    "10"
  max_position_usd:  "5000"
  signal_ttl_seconds: 3.0
  cooldown_seconds:   5.0
  min_score:         "70"

executor:
  leg1_timeout_seconds: 5.0
  leg2_timeout_seconds: 60.0
  min_fill_ratio:       "0.8"
  slippage_bps:         "30"
  use_flashbots:        true

# Risk limits — Day-1 conservative settings per docs/strategy_review.md.
# Ramp-up plan (instructor sign-off required between days):
#   Day 1:   max_trade_usd=5,  max_daily_loss=10
#   Day 2-3: max_trade_usd=10, max_daily_loss=15
#   Day 4-5: max_trade_usd=20, max_daily_loss=20  (= ABSOLUTE limits)
risk:
  initial_capital_usd:    "100"
  max_trade_usd:          "5"
  max_trade_pct:          "0.05"
  max_position_per_token: "20"
  max_open_positions:     1
  max_loss_per_trade:     "3"
  max_daily_loss:         "10"
  max_drawdown_pct:       "0.15"
  max_trades_per_hour:    10
  consecutive_loss_limit: 2
