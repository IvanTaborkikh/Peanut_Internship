# TEST mode: Binance testnet for CEX, real mainnet/Arbitrum RPC for DEX reads.
# dry_run=true means we build & sign transactions but never broadcast them.
mode: test
dry_run: true

cex:
  exchange: binance
  api_key:  "${BINANCE_TESTNET_API_KEY}"
  secret:   "${BINANCE_TESTNET_SECRET}"
  testnet:  true

# Wallet is optional in test/dry_run, but Phase 4 will need it for signing.
# Comment out the wallet block to run without signing capabilities.
wallet:
  private_key: "${PRIVATE_KEY}"

chains:
  - chain_id: 1
    rpc_url: "${MAINNET_RPC_URL}"
    ws_url:  "${WS_RPC_URL}"

# Mainnet Uniswap V2 pools. Bot needs `pool_address` per pair to call
# PricingEngine.load_pools(). RouteFinder will discover multi-hop routes
# (e.g. BTC/USDT goes WBTC→WETH→USDT through the WBTC/WETH + WETH/USDT pools).
# On Arbitrum V2 is thin; would swap pricing module to SushiSwap/Camelot first.
pairs:
  - pair: ETH/USDT
    chain_id: 1
    pool_address: "0x0d4a11d5EEaaC28EC3F61d100daF4d40471f1852"
    trade_size: "0.1"
  - pair: ETH/USDC
    chain_id: 1
    pool_address: "0xB4e16d0168e52d35CaCD2c6185b44281Ec28C9Dc"
    trade_size: "0.1"
  # BTC pair — multi-hop routing via WBTC/WETH + WETH/USDT pools. Trade size
  # 0.0001 BTC ≈ $7 to stay well under max_trade_usd. Demonstrates a different
  # liquidity profile and 2-hop quoting.
  - pair: BTC/USDT
    chain_id: 1
    pool_address: "0xBb2b8038a1640196FbE3e38816F3e67Cba72D940"
    trade_size: "0.0001"

fees:
  cex_taker_bps: "10"
  cex_maker_bps: "2"
  dex_swap_bps:  "30"
  gas_cost_usd_default: "0.5"

signal:
  min_spread_bps:    "50"
  min_profit_usd:    "0.5"
  max_position_usd:  "1000"
  signal_ttl_seconds: 5.0
  cooldown_seconds:   2.0
  min_score:         "60"

executor:
  leg1_timeout_seconds: 5.0
  leg2_timeout_seconds: 60.0
  min_fill_ratio:       "0.8"
  slippage_bps:         "30"
  use_flashbots:        false

# Risk limits — validated against ABSOLUTE_* hardcoded ceilings.
# Test mode: comfortable for observing behaviour without real risk.
risk:
  initial_capital_usd:    "100"
  max_trade_usd:          "20"
  max_trade_pct:          "0.20"
  max_position_per_token: "30"
  max_open_positions:     1
  max_loss_per_trade:     "5"
  max_daily_loss:         "15"
  max_drawdown_pct:       "0.20"
  max_trades_per_hour:    20
  consecutive_loss_limit: 3
