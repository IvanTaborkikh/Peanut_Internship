# CHIP arb live config: Binance CHIP/USDC (mainnet) ↔ Uniswap V3 CHIP/USDC (Arbitrum).
#
# Both legs quote in USDC — no stablecoin drift, no override needed.
#
# Set `dry_run: false` to enable real broadcasting once allowances are granted
# (see scripts/grant_v3_allowances.py). Run dry-run smoke first: make dry-run-chip
mode: prod
dry_run: false

cex:
  exchange: binance
  api_key:  "${BINANCE_API_KEY}"
  secret:   "${BINANCE_SECRET}"
  testnet:  false

wallet:
  private_key: "${PRIVATE_KEY}"

chains:
  - chain_id: 42161
    rpc_url: "${ARBITRUM_RPC_URL}"
    ws_url:  "${WS_RPC_URL}"

dex:
  version:  v3
  fee_tier: 100        # 0.01% — most liquid V3 pool for CHIP/USDC

dex_quote_override: {}

stablecoin_converter: false

pairs:
  - pair: CHIP/USDC
    chain_id: 42161
    pool_address: ""
    trade_size: "200"

fees:
  cex_taker_bps: "10"
  cex_maker_bps: "2"
  dex_swap_bps:  "1"      # 0.01% V3 fee
  gas_cost_usd_default: "0.03"

signal:
  min_spread_bps:    "30"
  min_profit_usd:    "-0.15"
  max_position_usd:  "100"
  signal_ttl_seconds: 5.0
  cooldown_seconds:   3.0
  min_score:         "30"

executor:
  leg1_timeout_seconds: 5.0
  leg2_timeout_seconds: 60.0
  min_fill_ratio:       "0.8"
  slippage_bps:         "100"
  use_flashbots:        false

risk:
  initial_capital_usd:    "100"
  max_trade_usd:          "15"
  max_trade_pct:          "0.20"
  max_position_per_token: "30"
  max_open_positions:     1
  max_loss_per_trade:     "4"
  max_daily_loss:         "15"
  max_drawdown_pct:       "0.20"
  max_trades_per_hour:    20
  consecutive_loss_limit: 3
